name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production site
        run: |
          mkdir -p _site
          # Runtime site only — exclude pipeline references, tooling, and agent files.
          rsync -a \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'node_modules' \
            --exclude 'pipeline' \
            --exclude 'scripts' \
            --exclude 'docs' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.dockerignore' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
